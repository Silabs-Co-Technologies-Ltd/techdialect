name: TechDialect checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q smart_translation_system.py stem_learning.py data_studio.py publishing.py lesson_editor.py reviewer_roles.py
      - run: python -m pytest -q
